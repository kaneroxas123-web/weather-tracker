<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather dashboard </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter city name: " spellcheck="false">
            <button id="searchBtn">Search</button>

    </div>

    <p class="error" id="errorMsg"> City not found. Try Again!!</p>

    <div class ="weather" id="weatherDetails">
        <img src="" id="weatherIcon" alt="Weather icon">
        <h1 class="temp" id="temp">--°C</h1>
        <h2 class="city" id="cityName">--</h2>

        <div class="details">
            <div class="col">
                <p id="humidity">--%</p>
                <p> Humidity</p>
            </div>
            <div class="col">
                <p id="wind">--km/h</p>
                <p> Wind Speed</p>
            </div>
        </div>
    </div> 
    
    <script src="script.js"></script>
</body>
</html>
